<!doctype html>
<!-- Landing film globe segment (K3 → T3 → K4). Driven frame by frame by render.mjs:
     window.setup() loads assets, window.renderFrame(i) draws frame i and returns a PNG data URL
     plus the projected country labels for that frame. -->
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
</head>
<body>
<script type="module">
import * as THREE from "three";

const params = new URLSearchParams(location.search);
const W = 1152, H = 648, SS = Number(params.get("ss") || 2); // supersample, downscaled by ffmpeg
const FPS = 24, SECONDS = 12, FRAMES = FPS * SECONDS;
const D2R = Math.PI / 180;

// Sun fixed in world space: dawn line over Mexico/western South America, noon over Africa, night over China.
const SUN = { lat: -10, lon: -10 };

// Camera route: subpoints visited in order (lat, lon).
const ROUTE = [
  [-33, -63], // Argentina
  [-12, -50], // Brazil
  [-6, -74],  // Peru / Colombia
  [21, -100], // Mexico
  [12, -35],  // Atlantic
  [8, 3],     // Ghana / Nigeria
  [6, 38],    // Ethiopia / Kenya
  [32, 32],   // Egypt / Turkey
  [25, 76],   // Pakistan / India / Bangladesh
  [8, 104],   // Vietnam / Indonesia
  [29, 127],  // East China Sea, off Shanghai
];

// Distance from Earth's centre (in Earth radii) over normalised time.
// The final shot looks inland across China.
const LOOK_END = [31, 108];

const DIST = [[0, 4.3], [0.45, 3.6], [0.78, 2.9], [1, 1.5]];

// dvdnd amber, tuned for the night side.
const AMBER = [244, 176, 72];

function latLon(lat, lon, r = 1) {
  // Matches THREE.SphereGeometry's equirectangular UVs (u=0 at lon -180, v=1 at the north pole).
  const phi = (lon + 180) * D2R, theta = (90 - lat) * D2R;
  return new THREE.Vector3(-Math.cos(phi) * Math.sin(theta), Math.cos(theta), Math.sin(phi) * Math.sin(theta)).multiplyScalar(r);
}
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const easeInOut = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function piecewise(pts, t) {
  for (let i = 1; i < pts.length; i++) if (t <= pts[i][0]) {
    const [t0, v0] = pts[i - 1], [t1, v1] = pts[i];
    const k = easeInOut((t - t0) / (t1 - t0));
    return v0 + (v1 - v0) * k;
  }
  return pts[pts.length - 1][1];
}

let renderer, scene, camera, earth, overlayCanvas, overlayCtx, overlayTex, countries, curve, activation;

async function loadTex(url) {
  const t = await new THREE.TextureLoader().loadAsync(url);
  t.colorSpace = THREE.NoColorSpace;
  t.anisotropy = 16;
  return t;
}

function countryPath(ctx, geom, w, h) {
  ctx.beginPath();
  const polys = geom.type === "Polygon" ? [geom.coordinates] : geom.coordinates;
  for (const poly of polys) for (const ring of poly) {
    ring.forEach(([lon, lat], i) => {
      const x = (lon + 180) / 360 * w, y = (90 - lat) / 180 * h;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    });
    ctx.closePath();
  }
}

function camAt(t) {
  const e = easeInOut(t);
  const sub = curve.getPointAt(e).normalize();
  const dist = piecewise(DIST, t);
  const tangent = curve.getTangentAt(e);
  const along = sub.clone().add(tangent.multiplyScalar(0.9)).normalize();
  const ahead = along.lerp(latLon(...LOOK_END), smooth(0.7, 1.0, t)).normalize();
  return { sub, dist, ahead };
}

window.setup = async () => {
  renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(W * SS, H * SS);
  renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(30, W / H, 0.01, 200);

  const [day, night, geo] = await Promise.all([
    loadTex("cache/bluemarble.jpg"),
    loadTex("cache/blackmarble-8k.jpg"),
    fetch("countries.json").then((r) => r.json()),
  ]);
  countries = geo.features.map((f) => ({ ...f.properties, geom: f.geometry, anchor: latLon(f.properties.lat, f.properties.lon) }));

  overlayCanvas = document.createElement("canvas");
  overlayCanvas.width = 8192; overlayCanvas.height = 4096;
  overlayCtx = overlayCanvas.getContext("2d");
  overlayTex = new THREE.CanvasTexture(overlayCanvas);
  overlayTex.colorSpace = THREE.NoColorSpace;
  overlayTex.anisotropy = 16;

  const sunDir = latLon(SUN.lat, SUN.lon).normalize();

  earth = new THREE.Mesh(
    new THREE.SphereGeometry(1, 256, 256),
    new THREE.ShaderMaterial({
      uniforms: { day: { value: day }, night: { value: night }, overlay: { value: overlayTex }, sunDir: { value: sunDir } },
      vertexShader: `
        varying vec2 vUv; varying vec3 vN; varying vec3 vW;
        void main() {
          vUv = uv; vN = normalize(normal); vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz;
          gl_Position = projectionMatrix * viewMatrix * w;
        }`,
      fragmentShader: `
        uniform sampler2D day, night, overlay; uniform vec3 sunDir;
        varying vec2 vUv; varying vec3 vN; varying vec3 vW;
        void main() {
          vec3 n = normalize(vN);
          vec3 v = normalize(cameraPosition - vW);
          float d = dot(n, sunDir);
          float dayAmt = smoothstep(-0.10, 0.22, d);
          vec3 dayCol = texture2D(day, vUv).rgb;
          dayCol = pow(dayCol, vec3(1.05)) * (0.05 + 1.15 * max(d, 0.0));
          vec3 nightCol = texture2D(night, vUv).rgb;
          float lum = max(nightCol.r, max(nightCol.g, nightCol.b));
          float lights = pow(smoothstep(0.06, 0.9, lum), 1.5) * 2.3;
          nightCol = texture2D(day, vUv).rgb * vec3(0.05, 0.07, 0.11) + lights * vec3(1.0, 0.76, 0.46);
          vec3 col = mix(nightCol, dayCol, dayAmt);
          vec4 ov = texture2D(overlay, vUv);
          // Amber highlights: a restrained additive glow at night, a firmer tint by day.
          col = mix(col, ov.rgb, ov.a * 0.85 * dayAmt) + ov.rgb * ov.a * 0.22 * (1.0 - dayAmt);
          // Atmosphere rim seen from inside the limb.
          float rim = pow(1.0 - max(dot(n, v), 0.0), 3.0);
          col += vec3(0.30, 0.55, 1.0) * rim * (0.15 + 0.85 * smoothstep(-0.3, 0.4, d)) * 0.8;
          gl_FragColor = vec4(col, 1.0);
        }`,
    }),
  );
  scene.add(earth);

  // Atmosphere halo outside the limb.
  scene.add(new THREE.Mesh(
    new THREE.SphereGeometry(1.08, 128, 128),
    new THREE.ShaderMaterial({
      uniforms: { sunDir: { value: sunDir } },
      side: THREE.BackSide, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
      vertexShader: `varying vec3 vN; varying vec3 vW;
        void main(){ vN = normalize(normal); vec4 w = modelMatrix*vec4(position,1.0); vW = w.xyz; gl_Position = projectionMatrix*viewMatrix*w; }`,
      fragmentShader: `uniform vec3 sunDir; varying vec3 vN; varying vec3 vW;
        void main(){
          vec3 v = normalize(cameraPosition - vW);
          float i = pow(smoothstep(0.0, 0.378, -dot(vN, v)), 3.5) * 0.55;
          float lit = smoothstep(-0.45, 0.35, dot(normalize(vW), sunDir));
          gl_FragColor = vec4(vec3(0.32, 0.58, 1.0) * i * (0.2 + 0.9 * lit), 1.0);
        }`,
    }),
  ));

  // Star field, seeded so every render is identical.
  let seed = 7; const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const starPos = [], starCol = [];
  for (let i = 0; i < 4000; i++) {
    const v = new THREE.Vector3(rand() * 2 - 1, rand() * 2 - 1, rand() * 2 - 1).normalize().multiplyScalar(80);
    starPos.push(v.x, v.y, v.z);
    const b = Math.pow(rand(), 3) * 0.9 + 0.1;
    starCol.push(b, b, b * (0.9 + rand() * 0.2));
  }
  const sg = new THREE.BufferGeometry();
  sg.setAttribute("position", new THREE.Float32BufferAttribute(starPos, 3));
  sg.setAttribute("color", new THREE.Float32BufferAttribute(starCol, 3));
  scene.add(new THREE.Points(sg, new THREE.PointsMaterial({ size: 1.6 * SS, sizeAttenuation: false, vertexColors: true })));

  curve = new THREE.CatmullRomCurve3(ROUTE.map(([la, lo]) => latLon(la, lo)), false, "centripetal");

  // Each country activates the first time the camera's subpoint passes within 32° of it, then stays lit.
  activation = countries.map((c) => {
    for (let f = 0; f <= FRAMES; f++) {
      const { sub } = camAt(f / FRAMES);
      if (sub.angleTo(c.anchor) < 32 * D2R) return f / FPS;
    }
    return SECONDS;
  });
  return { frames: FRAMES, fps: FPS, width: W, height: H, activation: countries.map((c, i) => [c.iso, +activation[i].toFixed(2)]) };
};

function drawOverlay(sec) {
  const ctx = overlayCtx, w = overlayCanvas.width, h = overlayCanvas.height;
  ctx.clearRect(0, 0, w, h);
  const pulse = 0.88 + 0.12 * Math.sin(sec * Math.PI * 2 * 0.45);
  const [r, g, b] = AMBER;
  countries.forEach((c, i) => {
    const k = smooth(activation[i], activation[i] + 0.9, sec) * pulse;
    c.intensity = k;
    if (k <= 0.01) return;
    countryPath(ctx, c.geom, w, h);
    ctx.save();
    ctx.shadowColor = `rgba(${r},${g},${b},${0.9 * k})`;
    ctx.shadowBlur = 40 * k;
    ctx.fillStyle = `rgba(${r},${g},${b},${0.32 * k})`;
    ctx.fill();
    ctx.restore();
    ctx.lineJoin = "round";
    ctx.lineWidth = 5;
    ctx.strokeStyle = `rgba(255,214,140,${0.95 * k})`;
    ctx.stroke();
  });
  overlayTex.needsUpdate = true;
}

window.renderFrame = (f) => {
  const t = f / (FRAMES - 1), sec = f / FPS;
  drawOverlay(sec);
  const { sub, dist, ahead } = camAt(t);
  camera.position.copy(sub).multiplyScalar(dist);
  // Look straight at the centre while high; as the camera descends, pitch up from straight down
  // (90°) to 59° below the local horizontal (the horizon sits ~48° below from 1.5 radii), facing the route ahead, so the horizon comes into frame.
  const k = smooth(0.72, 1.0, t);
  const pitch = (90 - 31 * k) * D2R;
  const fwd = ahead.clone().sub(sub.clone().multiplyScalar(ahead.dot(sub))).normalize();
  const lookDir = fwd.multiplyScalar(Math.cos(pitch)).sub(sub.clone().multiplyScalar(Math.sin(pitch)));
  // Level the horizon: blend 'up' from north to the local vertical.
  camera.up.set(0, 1, 0).lerp(sub, k).normalize();
  camera.lookAt(camera.position.clone().add(lookDir));
  // Shift the globe right of centre while high, leaving room for the headline on the left.
  const shift = (1 - smooth(0.75, 1.0, t)) * 0.16;
  camera.setViewOffset(W, H, -W * shift, 0, W, H);
  camera.updateMatrixWorld();
  renderer.render(scene, camera);

  const camDir = camera.position.clone().normalize();
  const labels = [];
  countries.forEach((c) => {
    if (c.intensity <= 0.05) return;
    const facing = c.anchor.dot(camDir);
    if (facing < 0.25) return;
    const p = c.anchor.clone().project(camera);
    const x = (p.x + 1) / 2 * W, y = (1 - p.y) / 2 * H;
    if (x < 0 || x > W || y < 0 || y > H) return;
    labels.push({ iso: c.iso, name: c.name, x: +x.toFixed(1), y: +y.toFixed(1), o: +(Math.min(1, c.intensity) * smooth(0.25, 0.5, facing)).toFixed(2) });
  });
  return { png: renderer.domElement.toDataURL("image/png"), labels };
};
</script>
</body>
</html>
